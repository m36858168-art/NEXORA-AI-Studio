
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #100d18;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 7%;
  border-bottom: 1px solid #30243e;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #bd91ff;
  letter-spacing: 2px;
}

select, button, textarea {
  font-family: inherit;
}

select {
  background: #21182d;
  color: white;
  padding: 10px;
  border: 1px solid #68439b;
  border-radius: 9px;
}

main {
  max-width: 850px;
  margin: 65px auto;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 35px;
  color: #d2b4ff;
}

.subtitle {
  color: #b5a9c2;
  line-height: 2;
}

.panel {
  background: #1b1525;
  border: 1px solid #453057;
  border-radius: 20px;
  padding: 25px;
  margin-top: 35px;
  text-align: right;
}

label {
  display: block;
  margin: 18px 0 10px;
}

textarea {
  width: 100%;
  height: 120px;
  resize: vertical;
  background: #100d18;
  color: white;
  border: 1px solid #60427e;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
}

.style {
  width: 100%;
  margin-bottom: 15px;
}

button {
  background: linear-gradient(100deg,#7435ba,#a66bfa);
  color: white;
  border: 0;
  padding: 15px;
  width: 100%;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 22px;
  color: #cbb2ed;
  text-align: center;
  line-height: 2;
}

footer {
  text-align: center;
  color: #81758e;
  padding: 30px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>

  <select id="language" onchange="changeLanguage()">
    <option value="fa">فارسی</option>
    <option value="en">English</option>
  </select>
</header>

<main>

  <h1 id="title">تصوراتت را به تصویر تبدیل کن</h1>

  <p class="subtitle" id="subtitle">
    قدرت خلاقیت با هوش مصنوعی؛ آینده طراحی اینجاست.
  </p>

  <section class="panel">

    <label id="promptLabel">
      توضیح تصویر مورد نظرت را بنویس:
    </label>

    <textarea id="prompt"
      placeholder="مثلاً یک شهر آینده‌نگر با نورهای بنفش...">
    </textarea>

    <label id="styleLabel">سبک تصویر</label>

    <select class="style" id="imageStyle">
      <option>واقع‌گرایانه</option>
      <option>فانتزی</option>
      <option>سه‌بعدی</option>
      <option>هنری</option>
      <option>مینیمال</option>
    </select>

    <button id="generate" onclick="generateImage()">
      ✨ ساخت تصویر
    </button>

    <div id="result">
      تصاویر ساخته‌شده در این قسمت نمایش داده می‌شوند.
    </div>

  </section>

</main>

<footer>
  NEXORA AI STUDIO © 2026
</footer>

<script>

function changeLanguage() {

  const en = document.getElementById("language").value === "en";

  document.documentElement.lang = en ? "en" : "fa";
  document.documentElement.dir = en ? "ltr" : "rtl";

  document.getElementById("title").textContent =
    en ? "Turn your imagination into images" :
    "تصوراتت را به تصویر تبدیل کن";

  document.getElementById("subtitle").textContent =
    en ? "Creativity powered by artificial intelligence." :
    "قدرت خلاقیت با هوش مصنوعی؛ آینده طراحی اینجاست.";

  document.getElementById("promptLabel").textContent =
    en ? "Describe your image:" :
    "توضیح تصویر مورد نظرت را بنویس:";

  document.getElementById("styleLabel").textContent =
    en ? "Image style" : "سبک تصویر";

  document.getElementById("generate").textContent =
    en ? "✨ Generate Image" : "✨ ساخت تصویر";

  document.getElementById("result").textContent =
    en ? "Your generated images will appear here." :
    "تصاویر ساخته‌شده در این قسمت نمایش داده می‌شوند.";
}

function generateImage() {

  const prompt = document.getElementById("prompt").value.trim();

  const en = document.getElementById("language").value === "en";

  document.getElementById("result").textContent = prompt
    ? (en
      ? "Your request is ready. Image generation will be connected in the next step."
      : "درخواستت ثبت شد. در مرحله بعد موتور تولید تصویر را متصل می‌کنیم.")
    : (en
      ? "Please describe your image first."
      : "لطفاً ابتدا توضیح تصویر را بنویس.");
}

</script>

</body>
</html>
